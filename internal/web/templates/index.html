{{define "main"}}
<h1>Dad jokes</h1>
<p>Search for a dad joke, or leave the field empty for a random one.</p>
<form action="/joke" method="get" hx-get="/joke" hx-target="#result" hx-indicator="#spinner" hx-disable="#search">
    <label for="term">Search word</label>
    <input type="search" id="term" name="term" value="{{.Term}}">
    <button type="submit" id="search">Search</button>
</form>
<p id="spinner" class="htmx-indicator" aria-busy="true">Fetching a joke…</p>
<div id="result">{{with .Result}}{{template "result" .}}{{end}}</div>
{{end}}
